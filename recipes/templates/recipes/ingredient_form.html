{% extends 'recipes/base.html' %}
{% block content %}
<h2>{{ title }} — {{ recipe.name }}</h2>
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label>Name</label>
        <input type="text" name="name" class="form-control"
               value="{{ ingredient.name }}" required>
    </div>
    <div class="mb-3">
        <label>Quantity</label>
        <input type="number" step="0.01" name="quantity" class="form-control"
               value="{{ ingredient.quantity }}" required>
    </div>
    <div class="mb-3">
        <label>Unit Price</label>
        <input type="number" step="0.01" name="unit_price" class="form-control"
               value="{{ ingredient.unit_price }}" required>
    </div>
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'recipe_detail' recipe.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
